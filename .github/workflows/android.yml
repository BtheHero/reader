# Builds Reader for Android and publishes the APK at
# https://github.com/ilyasbt/reader/releases/tag/app-latest  (download: …/releases/download/app-latest/Reader.apk)
#
# Signing: the repository secrets ANDROID_KEYSTORE_BASE64 (the keystore file, base64) and
# ANDROID_KEYSTORE_PASSWORD. Without them it still builds, with a throwaway key: installing such a build over
# an earlier one needs uninstalling first.
name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/reader.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/reader.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway key (uninstall the old app before installing this build)"
          fi

      - name: Build
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Reader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Reader-apk
          path: Reader.apk

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Reader for Android
          body: |
            Latest build of Reader for Android (build ${{ github.run_number }}, ${{ github.sha }}).
            Download **Reader.apk** below on your phone and open it to install or update.
          files: Reader.apk
          make_latest: true
